<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Louise and Oatie's Puzzle Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Press Start 2P', monospace; color: #fff; user-select: none; -webkit-user-select: none; }
#c { position: fixed; inset: 0; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.ov { position: fixed; inset: 0; pointer-events: none; }
.hide { display: none !important; }
.px { text-shadow: 2px 2px 0 #1a1030, -1px -1px 0 #1a1030, 1px -1px 0 #1a1030, -1px 1px 0 #1a1030; }
.win { background: linear-gradient(180deg, rgba(40,52,150,.92), rgba(16,20,80,.92)); border: 3px solid #e8e8ff; box-shadow: 0 0 0 3px #1a1440, 6px 6px 0 rgba(0,0,0,.4); border-radius: 6px; }

/* ---------- title ---------- */
#title { display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 3vh 2vw 2.5vh; }
#title.show { display: flex; }
#logo { text-align: center; line-height: 1.25; margin-top: 1vh; animation: bob 3s ease-in-out infinite; }
#logo .l1 { font-size: clamp(18px, 4.2vw, 50px); color: #ffd84a; text-shadow: 0 4px 0 #c85a1e, 0 8px 0 #6a2a10, 4px 10px 0 rgba(0,0,0,.35); letter-spacing: 2px; }
#logo .l2 { font-size: clamp(22px, 5.6vw, 68px); color: #ff8fc4; text-shadow: 0 4px 0 #a8326a, 0 8px 0 #4a1030, 4px 12px 0 rgba(0,0,0,.35); letter-spacing: 3px; margin-top: .3em; }
#logo .paws { font-size: clamp(10px, 1.4vw, 16px); color: #fff; margin-top: 1.2em; opacity: .9; }
@keyframes bob { 50% { transform: translateY(6px) rotate(-.5deg); } }
#menu { pointer-events: auto; padding: 10px 22px; min-width: min(380px, 90vw); }
#menu .mi { font-size: clamp(11px, 1.4vw, 15px); padding: 9px 10px 9px 36px; cursor: pointer; position: relative; color: #cfd4ff; }
#menu .mi.on { color: #fff; }
#menu .mi.on::before { content: '▶'; position: absolute; left: 6px; color: #ffd84a; animation: blink .6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
#lastcode { font-size: 9px; color: #a8b0ff; text-align: center; margin-top: 8px; min-height: 10px; }
.foot { font-size: 9px; color: #fff; opacity: .85; text-align: center; margin-top: 12px; line-height: 1.8; }

/* ---------- HUD ---------- */
#hud .tl { position: absolute; left: 14px; top: 12px; padding: 10px 14px; }
#lvlnum { font-size: 10px; color: #ffd84a; }
#lvlname { font-size: 13px; margin-top: 7px; }
#lvlcode { font-size: 9px; margin-top: 8px; color: #7affb0; letter-spacing: 2px; }
#dogbar { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.dogchip { font-size: 10px; padding: 8px 12px 8px 8px; display: flex; align-items: center; gap: 8px; background: rgba(16,20,60,.75); border: 2px solid rgba(255,255,255,.35); border-radius: 4px; cursor: pointer; color: #cfd4ff; }
.dogchip.sel { background: rgba(60,70,190,.92); border-color: #ffd84a; color: #fff; }
.dogchip .fz { width: 14px; height: 6px; border-radius: 50%; display: inline-block; border: 2px solid #fff; margin-left: 4px; }
body.night .win { background: linear-gradient(180deg, rgba(70,40,150,.92), rgba(24,12,70,.92)); border-color: #e6dcff; }
body.night .dogchip { background: rgba(30,16,70,.8); }
body.night .dogchip.sel { background: rgba(90,50,190,.92); }
body.night #lvlnum { color: #c9b8ff; }
#ending .nc { color: #7affb0; letter-spacing: 3px; }
.dogchip .sw { width: 16px; height: 16px; border: 3px solid; border-radius: 3px; display: inline-block; }
#hintbox { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; width: min(760px, 94vw); padding: 12px 16px; font-size: 10px; line-height: 1.8; }
#hintbox .k { color: #ffd84a; }
#keys { position: absolute; left: 14px; top: 104px; font-size: 8px; line-height: 1.9; opacity: .85; }
body.hintup #keys { display: none; }
#mute { position: absolute; right: 12px; bottom: 14px; font-size: 9px; padding: 8px 10px; pointer-events: auto; cursor: pointer; }
#card { position: absolute; left: 0; right: 0; top: 36%; text-align: center; opacity: 0; }
#card.show { animation: card 2.4s ease forwards; }
#card .a { font-size: clamp(18px, 3.4vw, 36px); color: #ffd84a; }
#card .b { font-size: clamp(11px, 1.8vw, 18px); margin-top: 14px; }
@keyframes card { 0% { opacity: 0; transform: scale(1.6); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
#flash { position: absolute; left: 0; right: 0; top: 20%; text-align: center; font-size: 11px; opacity: 0; }
#flash.show { animation: fl 1.8s ease forwards; }
@keyframes fl { 10%, 70% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- dialogs ---------- */
.dlg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: auto; background: rgba(0,0,20,.25); }
.dlg.show { display: flex; }
.dlg .win { padding: 26px 30px; text-align: center; max-width: 92vw; }
.dlg h2 { font-size: clamp(16px, 2.6vw, 26px); color: #ffd84a; margin: 0 0 18px; font-weight: normal; }
.dlg p { font-size: 11px; line-height: 1.9; margin: 10px 0; }
.code { font-size: clamp(22px, 3.4vw, 34px); color: #7affb0; letter-spacing: 6px; margin: 16px 0; }
.btn { font-family: inherit; font-size: 11px; color: #fff; background: #3a46c8; border: 3px solid #fff; padding: 10px 16px; margin: 8px 6px 0; cursor: pointer; border-radius: 4px; }
.btn:hover { background: #5462ff; }
#codein { font-family: inherit; font-size: 22px; text-transform: uppercase; letter-spacing: 6px; width: 260px; text-align: center; padding: 10px; background: #0c1040; color: #7affb0; border: 3px solid #fff; border-radius: 4px; outline: none; }
#codeerr { font-size: 9px; color: #ff9aa8; min-height: 14px; }
#clear { background: transparent; align-items: flex-end; padding-bottom: 3vh; }
#clear .win { padding: 14px 26px; } #clear h2 { margin-bottom: 6px; } #clear .code { margin: 8px 0; }
#ending { background: transparent; align-items: flex-end; padding-bottom: 3vh; }
#ending .win { padding: 14px 24px; } #ending h2 { margin-bottom: 8px; }
#ending .win { background: rgba(16,20,80,.78); }
#ending .credits { font-size: 10px; line-height: 2.2; }
#ending .credits b { color: #ff8fc4; font-weight: normal; }

/* ---------- touch controls ---------- */
#touch { display: none; position: fixed; inset: auto 0 0 0; height: 0; }
body.touch #touch { display: block; }
body.touch #hintbox { bottom: 170px; }
body.touch #keys { display: none; }
.tb { position: fixed; width: 54px; height: 54px; border-radius: 10px; background: rgba(30,36,120,.7); border: 3px solid rgba(255,255,255,.7); color: #fff; font-family: inherit; font-size: 14px; pointer-events: auto; touch-action: none; }
.tb.sm { width: auto; height: 40px; font-size: 9px; padding: 0 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="ov">
  <div id="logo" class="px"><div class="l1">LOUISE AND OATIE'S</div><div class="l2">PUZZLE QUEST</div><div class="paws">starring Bear · Louise · Oatie · Gerty Boots</div></div>
  <div>
    <div id="menu" class="win">
      <div class="mi on">START NEW GAME</div>
      <div class="mi">ENTER CODE</div>
    </div>
    <div id="lastcode" class="px"></div>
    <div class="foot px">ARROWS move · SPACE switch dog · Z undo · R restart · M sound</div>
  </div>
</div>

<div id="hud" class="ov hide">
  <div class="tl win"><div id="lvlnum">LEVEL 1</div><div id="lvlname" class="px"></div><div id="lvlcode"></div></div>
  <div id="dogbar"></div>
  <div id="hintbox" class="win"><span id="hint"></span></div>
  <div id="keys" class="px"></div>
  <div id="mute" class="win">♪ ON</div>
  <div id="card" class="px"><div class="a"></div><div class="b"></div></div>
  <div id="flash" class="px"></div>
</div>

<div id="codebox" class="dlg"><div class="win">
  <h2>ENTER CODE</h2>
  <input id="codein" maxlength="8" autocomplete="off" spellcheck="false">
  <div id="codeerr"></div>
  <button class="btn" id="codeok">GO!</button><button class="btn" id="codeback">BACK</button>
</div></div>

<div id="clear" class="dlg"><div class="win">
  <h2>LEVEL CLEAR!</h2>
  <p>Yum! Your code for the next level:</p>
  <div class="code" id="clearcode">BONE</div>
  <button class="btn" id="clearbtn">NEXT LEVEL ▶ (ENTER)</button>
</div></div>

<div id="pause" class="dlg"><div class="win">
  <h2>PAUSED</h2>
  <button class="btn" id="p_resume">RESUME (ESC)</button><br>
  <button class="btn" id="p_restart">RESTART LEVEL</button><br>
  <button class="btn" id="p_quit">QUIT TO TITLE (Q)</button>
</div></div>

<div id="ending" class="dlg"><div class="win">
  <h2 id="endtitle">THE END!</h2>
  <div class="credits" id="endtext"></div>
  <button class="btn" id="endbtn">BACK TO TITLE</button>
</div></div>

<div id="touch">
  <button class="tb" data-k="0" style="left:76px;bottom:120px">▲</button>
  <button class="tb" data-k="3" style="left:16px;bottom:62px">◀</button>
  <button class="tb" data-k="1" style="left:136px;bottom:62px">▶</button>
  <button class="tb" data-k="2" style="left:76px;bottom:6px">▼</button>
  <button class="tb sm" data-k="sw" style="right:16px;bottom:80px">SWITCH</button>
  <button class="tb sm" data-k="undo" style="right:16px;bottom:24px">UNDO</button>
  <button class="tb sm" data-k="reset" style="right:100px;bottom:24px">RESET</button>
</div>

<script>/* lite3d: a tiny PS1-style WebGL engine exposing the small three.js-like API the game uses.

(function (root) {

  set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; }
  setScalar(s) { this.x = this.y = this.z = s; return this; }
  copy(v) { this.x = v.x; this.y = v.y; this.z = v.z; return this; }
  clone() { return new Vector3(this.x, this.y, this.z); }

  addScaledVector(v, s) { this.x += v.x * s; this.y += v.y * s; this.z += v.z * s; return this; }
  multiplyScalar(s) { this.x *= s; this.y *= s; this.z *= s; return this; }
  lerp(v, t) { this.x += (v.x - this.x) * t; this.y += (v.y - this.y) * t; this.z += (v.z - this.z) * t; return this; }

  normalize() { const l = this.length() || 1; return this.multiplyScalar(1 / l); }
}
class Euler { constructor() { this.x = 0; this.y = 0; this.z = 0; } set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; } }
class Color { constructor(h = 0xffffff) { this.setHex(h); } setHex(h) { this.r = (h >> 16 & 255) / 255; this.g = (h >> 8 & 255) / 255; this.b = (h & 255) / 255; return this; } }
const MathUtils = { degToRad: d => d * Math.PI / 180 };

// ---- matrices (column-major) ----
function compose(te, p, r, s) {
  const a = Math.cos(r.x), b = Math.sin(r.x), c = Math.cos(r.y), d = Math.sin(r.y), e = Math.cos(r.z), f = Math.sin(r.z);

  te[1] = (af + be * d) * s.x; te[5] = (ae - bf * d) * s.y; te[9] = -b * c * s.z;
  te[2] = (bf - ae * d) * s.x; te[6] = (be + af * d) * s.y; te[10] = a * c * s.z;

}
function mul(o, a, b) {

    o[j * 4 + i] = a[i] * b[j * 4] + a[4 + i] * b[j * 4 + 1] + a[8 + i] * b[j * 4 + 2] + a[12 + i] * b[j * 4 + 3];

// ---- scene graph ----
let idc = 1;
class Object3D {
  constructor() { this.id = idc++; this.position = new Vector3(); this.rotation = new Euler(); this.scale = new Vector3(1, 1, 1); this.children = []; this.parent = null; this.visible = true; this.renderOrder = 0; this.userData = {}; this.local = new Float32Array(16); this.world = new Float32Array(16); }
  add(...os) { for (const o of os) { if (o.parent) o.parent.remove(o); o.parent = this; this.children.push(o); } return this; }

}
class Group extends Object3D {}
class Scene extends Object3D { constructor() { super(); this.background = null; this.fog = null; } }
class Mesh extends Object3D { constructor(g, m) { super(); this.geometry = g; this.material = m; } }
class Sprite extends Object3D { constructor(m) { super(); this.material = m; this.isSprite = true; } }
class Fog { constructor(c, near, far) { this.color = new Color(c); this.near = near; this.far = far; } }
class HemisphereLight extends Object3D { constructor(s, g, i) { super(); this.isHemi = true; this.sky = new Color(s); this.ground = new Color(g); this.intensity = i; } }
class PointLight extends Object3D { constructor(c, i = 1, d = 3) { super(); this.isPoint = true; this.color = new Color(c); this.intensity = i; this.distance = d; } }
class DirectionalLight extends Object3D { constructor(c, i) { super(); this.isDir = true; this.color = new Color(c); this.intensity = i; } }

  constructor(fov, aspect, near, far) { super(); this.fov = fov; this.aspect = aspect; this.near = near; this.far = far; this.proj = new Float32Array(16); this.view = new Float32Array(16); this.axes = [new Vector3(), new Vector3(), new Vector3()]; this.updateProjectionMatrix(); this.lookAt(new Vector3(0, 0, -1)); }
  updateProjectionMatrix() {

    const x = new Vector3(z.z, 0, -z.x).normalize(); // cross(up, z)

    v[1] = y.x; v[5] = y.y; v[9] = y.z; v[13] = -(y.x * e.x + y.y * e.y + y.z * e.z);
    v[2] = z.x; v[6] = z.y; v[10] = z.z; v[14] = -(z.x * e.x + z.y * e.y + z.z * e.z);

class Geometry {

  rotateX(a) { const c = Math.cos(a), s = Math.sin(a), p = this.pos; for (let i = 0; i < p.length; i += 3) { const y = p[i + 1], z = p[i + 2]; p[i + 1] = y * c - z * s; p[i + 2] = y * s + z * c; } this.version++; return this; }

function ConeGeometry(r, h, seg = 8) { return lathe(0, r, h, seg, false); }

function syncAll(s, snapDogs) {

  for (const k in crateM) for (const m of crateM[k]) { scene.remove(m); crateMeshes.push(m); }

  for (let i = 0; i < N * N; i++) {

/* ---------- main loop ---------- */
let last = performance.now(), T = 0;

  for (let i = winds.length - 1; i >= 0; i--) { const w = winds[i]; w.m.position.x += w.dx * dt * 6; w.m.position.z += w.dz * dt * 6; w.life -= dt; if (w.life < 0) { scene.remove(w.m); winds.splice(i, 1); } }

  for (let i = sparks.length - 1; i >= 0; i--) { const s = sparks[i]; s.v.y -= 7 * dt; s.m.position.addScaledVector(s.v, dt); s.life -= dt; if (!s.solid) { const k = Math.max(0.01, s.life); s.m.scale.set(0.22 * k * 1.5, 1, 0.22 * k * 1.5); } if (s.life < 0) { scene.remove(s.m); sparks.splice(i, 1); } }

    const v = dogsV[game.sel]; marker.visible = true;
    marker.position.set(v.pos.x, v.pos.y + v.S * 0.9 + 0.35 + Math.sin(T * 4) * 0.06 - v.lie * 0.2, v.pos.z); marker.rotation.y += dt * 3;

    } else if (LV.pool && LV.night) {
    } else if (LV.pool) {
